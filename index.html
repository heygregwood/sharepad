<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SharePad — quick pages</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>SharePad</h1>
    <p class="subtitle">Simple one‑page sites and PDFs — quick to create and share.</p>
  </header>

  <main class="content">
    <section class="pdf-preview">
      <a class="download-btn" href="pdfs/family-things-to-do.pdf" download>Download PDF</a>
      <div class="iframe-wrap">
        <iframe src="pdfs/family-things-to-do.pdf" title="PDF preview" frameborder="0"></iframe>
      </div>
      <p class="note">If the PDF doesn't display on your device, use the download button above.</p>
    </section>

    <section class="quick-links">
      <h2>Create a new page</h2>
      <p>Place files under <code>pages/&lt;slug&gt;/</code> or upload PDFs to <code>pdfs/</code>. See README for details.</p>
    </section>
  </main>

  <footer class="site-footer">
    <small>SharePad — created by heygregwood</small>
  </footer>
</body>
</html>
