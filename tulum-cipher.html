<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tulum Cipher - Crossword Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --parchment: #F8F5F2;
            --forest: #1B4332;
            --earth: #B07D62;
            --black-square: #2d3e2f;
            --highlight: #ffd966;
            --correct: #95d5b2;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: var(--parchment);
            color: var(--forest);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Merriweather', serif;
            font-size: 2.5em;
            color: var(--forest);
            margin-bottom: 10px;
        }

        .level-indicator {
            font-size: 1.2em;
            color: var(--earth);
            font-weight: 700;
            margin-bottom: 20px;
        }

        .game-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 20px;
        }

        .crossword-wrapper {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .crossword-grid {
            display: grid;
            gap: 1px;
            background: #333;
            padding: 1px;
            border: 3px solid var(--forest);
            width: fit-content;
            margin: 0 auto;
        }

        .cell {
            width: 45px;
            height: 45px;
            background: white;
            border: none;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            font-family: 'Lato', sans-serif;
            padding: 0;
        }

        .cell.black {
            background: var(--black-square);
            cursor: default;
        }

        .cell.active {
            background: var(--highlight);
        }

        .cell.highlighted {
            background: #ffe699;
        }

        .cell.correct {
            background: var(--correct);
        }

        .cell-number {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 9px;
            font-weight: 700;
            color: var(--forest);
            pointer-events: none;
        }

        .clues-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-height: 600px;
            overflow-y: auto;
        }

        .clues-section {
            margin-bottom: 20px;
        }

        .clues-section h3 {
            font-family: 'Merriweather', serif;
            color: var(--forest);
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .clue {
            padding: 8px 10px;
            margin-bottom: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clue:hover {
            background: #f0f0f0;
        }

        .clue.active {
            background: var(--highlight);
            font-weight: 700;
        }

        .clue-number {
            font-weight: 700;
            color: var(--earth);
            margin-right: 5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            background: var(--forest);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #2d5a3d;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--earth);
        }

        .btn-secondary:hover {
            background: #9a6a52;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }

        .modal h2 {
            font-family: 'Merriweather', serif;
            font-size: 2.5em;
            color: var(--forest);
            margin-bottom: 20px;
        }

        .modal p {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #666;
        }

        .stats {
            background: var(--parchment);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }

        .stat-item:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-weight: 700;
            color: var(--forest);
        }

        .stat-value {
            color: var(--earth);
            font-weight: 700;
        }

        .penalty-notice {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--earth);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s;
            z-index: 100;
        }

        .penalty-notice.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .game-container {
                grid-template-columns: 1fr;
            }

            .crossword-grid {
                gap: 1px;
            }

            .cell {
                font-size: 16px;
            }

            h1 {
                font-size: 1.8em;
            }

            .modal {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>THE TULUM CIPHER</h1>
            <div class="level-indicator" id="levelIndicator">Level 1 of 10</div>
        </header>

        <div class="game-container">
            <div class="crossword-wrapper">
                <div class="crossword-grid" id="crosswordGrid"></div>
            </div>

            <div class="clues-container">
                <div class="clues-section">
                    <h3>ACROSS</h3>
                    <div id="acrossClues"></div>
                </div>
                <div class="clues-section">
                    <h3>DOWN</h3>
                    <div id="downClues"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="revealLetter()">Reveal Letter (-30s)</button>
            <button class="btn" onclick="checkPuzzle()">Check Puzzle</button>
            <button class="btn btn-secondary" onclick="clearGrid()">Clear Grid</button>
        </div>
    </div>

    <div class="overlay" id="levelCompleteOverlay">
        <div class="modal">
            <h2>Level Complete! 🎉</h2>
            <p id="levelCompleteMessage">Excellent work!</p>
            <button class="btn" onclick="nextLevel()">Proceed to Next Level</button>
        </div>
    </div>

    <div class="overlay" id="victoryOverlay">
        <div class="modal">
            <h2>🏆 GRAND MASTER 🏆</h2>
            <p>You've conquered all 10 levels!</p>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total Time:</span>
                    <span class="stat-value" id="finalTime">00:00</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Hints Used:</span>
                    <span class="stat-value" id="finalHints">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Time Penalties:</span>
                    <span class="stat-value" id="finalPenalties">0s</span>
                </div>
            </div>
            <p style="font-size: 1.5em; color: var(--forest); margin-top: 20px;">Mission Accomplished!</p>
            <button class="btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <div class="penalty-notice" id="penaltyNotice">+30 second penalty</div>

                    ['P','','','','','','','','A'],

                ],
                numbering: {
                    '0-0': 1, '0-8': 2, '2-0': 3, '4-0': 4
                },
                clues: {
                    across: [
                        {num: 1, clue: 'Tournament winners', answer: 'CHAMPIONS'},
                        {num: 3, clue: '12:00 AM', answer: 'MIDNIGHT'},
                        {num: 4, clue: 'Brightness or low weight', answer: 'LIGHTNESS'}

        let currentLevel = 0;
        let currentPuzzle = null;
        let userGrid = [];
        let activeCell = null;
        let activeDirection = 'across';
        let startTime = Date.now();
        let totalPenalties = 0;
        let hintsUsed = 0;

        function initGame() {
            loadLevel(currentLevel);
        }

        function loadLevel(levelIndex) {
            currentPuzzle = PUZZLES[levelIndex];
            document.getElementById('levelIndicator').textContent = `Level ${levelIndex + 1} of 10`;
            userGrid = Array(currentPuzzle.size).fill().map(() => Array(currentPuzzle.size).fill(''));
            renderGrid();
            renderClues();
        }

        function renderGrid() {
            const grid = document.getElementById('crosswordGrid');
            grid.innerHTML = '';

            const isMobile = window.innerWidth <= 768;
            const cellSize = isMobile ? Math.min(38, Math.floor((window.innerWidth - 80) / currentPuzzle.size)) : 45;

            grid.style.gridTemplateColumns = `repeat(${currentPuzzle.size}, ${cellSize}px)`;

            for (let row = 0; row < currentPuzzle.size; row++) {
                for (let col = 0; col < currentPuzzle.size; col++) {
                    const cellContainer = document.createElement('div');
                    cellContainer.style.position = 'relative';
                    cellContainer.style.width = cellSize + 'px';
                    cellContainer.style.height = cellSize + 'px';

                    const cell = document.createElement('input');
                    cell.className = 'cell';
                    cell.maxLength = 1;
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.style.width = '100%';
                    cell.style.height = '100%';

                    if (currentPuzzle.grid[row][col] === '') {
                        cell.classList.add('black');
                        cell.disabled = true;
                    } else {
                        const cellKey = `${row}-${col}`;
                        if (currentPuzzle.numbering[cellKey]) {
                            const numberSpan = document.createElement('span');
                            numberSpan.className = 'cell-number';
                            numberSpan.textContent = currentPuzzle.numbering[cellKey];
                            numberSpan.style.position = 'absolute';
                            numberSpan.style.top = '2px';
                            numberSpan.style.left = '3px';
                            numberSpan.style.fontSize = '9px';
                            numberSpan.style.fontWeight = '700';
                            numberSpan.style.color = 'var(--forest)';
                            numberSpan.style.pointerEvents = 'none';
                            numberSpan.style.zIndex = '10';
                            cellContainer.appendChild(numberSpan);
                        }

                        cell.addEventListener('click', () => selectCell(row, col));
                        cell.addEventListener('input', (e) => handleInput(e, row, col));
                        cell.addEventListener('keydown', (e) => handleKeyDown(e, row, col));
                    }

                    cellContainer.appendChild(cell);
                    grid.appendChild(cellContainer);
                }
            }
        }

        function renderClues() {
            const acrossContainer = document.getElementById('acrossClues');
            const downContainer = document.getElementById('downClues');

            acrossContainer.innerHTML = '';
            downContainer.innerHTML = '';

            currentPuzzle.clues.across.forEach(clue => {
                const clueDiv = document.createElement('div');
                clueDiv.className = 'clue';
                clueDiv.innerHTML = `<span class="clue-number">${clue.num}.</span>${clue.clue}`;
                acrossContainer.appendChild(clueDiv);
            });

            currentPuzzle.clues.down.forEach(clue => {
                const clueDiv = document.createElement('div');
                clueDiv.className = 'clue';
                clueDiv.innerHTML = `<span class="clue-number">${clue.num}.</span>${clue.clue}`;
                downContainer.appendChild(clueDiv);
            });
        }

        function selectCell(row, col) {
            activeCell = {row, col};
            highlightWord();
        }

        function highlightWord() {
            document.querySelectorAll('.cell').forEach(cell => {
                cell.classList.remove('active', 'highlighted');
            });

            if (!activeCell) return;

            const cell = document.querySelector(`[data-row="${activeCell.row}"][data-col="${activeCell.col}"]`);
            if (cell && !cell.disabled) {
                cell.classList.add('active');
                cell.focus();
            }
        }

        function findNextCell(row, col, direction) {
            if (direction === 'across') {
                // Check remaining cells in this row
                for (let c = col + 1; c < currentPuzzle.size; c++) {
                    if (currentPuzzle.grid[row][c] !== '') {
                        return {row, col: c, found: true};
                    }
                }
                // No more cells across, try down from original position
                for (let r = row + 1; r < currentPuzzle.size; r++) {
                    if (currentPuzzle.grid[r][col] !== '') {
                        return {row: r, col, found: true, switchedDir: true};
                    }
                }
            } else { // down
                // Check remaining cells in this column
                for (let r = row + 1; r < currentPuzzle.size; r++) {
                    if (currentPuzzle.grid[r][col] !== '') {
                        return {row: r, col, found: true};
                    }
                }
                // No more cells down, try across from original position
                for (let c = col + 1; c < currentPuzzle.size; c++) {
                    if (currentPuzzle.grid[row][c] !== '') {
                        return {row, col: c, found: true, switchedDir: true};
                    }
                }
            }
            return {found: false};
        }

        function handleInput(e, row, col) {
            const value = e.target.value.toUpperCase();
            userGrid[row][col] = value;

            if (value) {
                const next = findNextCell(row, col, activeDirection);
                if (next.found) {
                    if (next.switchedDir) {
                        activeDirection = activeDirection === 'across' ? 'down' : 'across';
                    }
                    const nextCell = document.querySelector(`[data-row="${next.row}"][data-col="${next.col}"]`);
                    if (nextCell) {
                        nextCell.focus();
                        selectCell(next.row, next.col);
                    }
                }
            }
        }

        function handleKeyDown(e, row, col) {
            if (e.key === ' ') {
                e.preventDefault();
                activeDirection = activeDirection === 'across' ? 'down' : 'across';
                highlightWord();
            } else if (e.key === 'Backspace' && !e.target.value) {
                e.preventDefault();
                const prev = findPrevCell(row, col, activeDirection);
                if (prev.found) {
                    const prevCell = document.querySelector(`[data-row="${prev.row}"][data-col="${prev.col}"]`);
                    if (prevCell) {
                        prevCell.focus();
                        prevCell.value = '';
                        selectCell(prev.row, prev.col);
                    }
                }
            }
        }

        function findPrevCell(row, col, direction) {
            if (direction === 'across') {
                for (let c = col - 1; c >= 0; c--) {
                    if (currentPuzzle.grid[row][c] !== '') {
                        return {row, col: c, found: true};
                    }
                }
            } else {
                for (let r = row - 1; r >= 0; r--) {
                    if (currentPuzzle.grid[r][col] !== '') {
                        return {row: r, col, found: true};
                    }
                }
            }
            return {found: false};
        }

        function checkPuzzle() {
            let allCorrect = true;
            let allFilled = true;

            for (let row = 0; row < currentPuzzle.size; row++) {
                for (let col = 0; col < currentPuzzle.size; col++) {
                    const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
                    if (currentPuzzle.grid[row][col] !== '') {
                        if (!cell.value) {
                            allFilled = false;
                        } else if (cell.value.toUpperCase() === currentPuzzle.grid[row][col]) {
                            cell.classList.add('correct');
                        } else {
                            allCorrect = false;
                            cell.classList.remove('correct');
                        }
                    }
                }
            }

            if (!allFilled) {
                alert('Please fill in all squares before checking!');
                return;
            }

            if (allCorrect) {
                setTimeout(() => {
                    if (currentLevel === 9) {
                        showVictory();
                    } else {
                        showLevelComplete();
                    }
                }, 500);
            } else {
                alert('Not quite right. Keep trying!');
            }
        }

        function revealLetter() {
            if (!activeCell) {
                alert('Please select a cell first');
                return;
            }

            const cell = document.querySelector(`[data-row="${activeCell.row}"][data-col="${activeCell.col}"]`);
            const correctLetter = currentPuzzle.grid[activeCell.row][activeCell.col];

            if (cell && correctLetter && correctLetter !== '') {
                cell.value = correctLetter;
                userGrid[activeCell.row][activeCell.col] = correctLetter;
                totalPenalties += 30;
                hintsUsed++;
                showPenaltyNotice();
            }
        }

        function clearGrid() {
            if (confirm('Are you sure you want to clear the entire grid?')) {
                document.querySelectorAll('.cell:not(.black)').forEach(cell => {
                    cell.value = '';
                    cell.classList.remove('correct');
                });
                userGrid = Array(currentPuzzle.size).fill().map(() => Array(currentPuzzle.size).fill(''));
            }
        }

        function showPenaltyNotice() {
            const notice = document.getElementById('penaltyNotice');
            notice.classList.add('show');
            setTimeout(() => {
                notice.classList.remove('show');
            }, 2000);
        }

        function showLevelComplete() {
            document.getElementById('levelCompleteMessage').textContent =
                `Level ${currentLevel + 1} complete! Ready for Level ${currentLevel + 2}?`;
            document.getElementById('levelCompleteOverlay').classList.add('active');
        }

        function nextLevel() {
            document.getElementById('levelCompleteOverlay').classList.remove('active');
            currentLevel++;
            loadLevel(currentLevel);
        }

        function showVictory() {
            const totalTime = Math.floor((Date.now() - startTime) / 1000) + totalPenalties;
            const minutes = Math.floor(totalTime / 60);
            const seconds = totalTime % 60;

            document.getElementById('finalTime').textContent =
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('finalHints').textContent = hintsUsed;
            document.getElementById('finalPenalties').textContent = `${totalPenalties}s`;

            document.getElementById('victoryOverlay').classList.add('active');
        }

        initGame();
    </script>
</body>
</html>
